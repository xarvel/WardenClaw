<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="776" viewBox="0 0 1440 776" role="img" aria-label="02-lifecycle"><title>02-lifecycle</title><defs><clipPath id="cb8"><rect x="40" y="130" width="300" height="210" rx="16"/></clipPath><clipPath id="cb9"><rect x="400" y="130" width="300" height="210" rx="16"/></clipPath><clipPath id="cb10"><rect x="760" y="130" width="300" height="210" rx="16"/></clipPath><clipPath id="cb11"><rect x="1120" y="130" width="300" height="210" rx="16"/></clipPath><marker id="ah2F6FED" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/></marker><marker id="ah7C5CF0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C5CF0"/></marker><clipPath id="cb12"><rect x="1120" y="420" width="300" height="230" rx="16"/></clipPath><clipPath id="cb13"><rect x="560" y="420" width="500" height="230" rx="16"/></clipPath><marker id="ah121620" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#121620"/></marker><clipPath id="cb14"><rect x="40" y="420" width="440" height="230" rx="16"/></clipPath><marker id="ah5F6776" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6776"/></marker></defs><rect width="1440" height="776" fill="#FFFFFF"/><g transform="translate(40,26) scale(0.19)"><path fill="#2F6FED" d="M62,120 C50,52 106,8 162,46 C124,28 92,48 94,88 L96,120 Z"/><path fill="#2F6FED" d="M194,120 C196,94 190,74 172,58 C166,72 162,86 162,100 L162,120 Z"/><path fill="#121620" d="M76,114 H180 A28,28 0 0 1 208,142 V206 A28,28 0 0 1 180,234 H76 A28,28 0 0 1 48,206 V142 A28,28 0 0 1 76,114 Z M114,213 L142,213 L136.6,183 A17.5,17.5 0 1 0 119.4,183 Z"/></g><text x="100.0" y="58.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#121620" text-anchor="start">Command lifecycle: from execve to a journal entry</text><text x="100.0" y="84.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">One command, seven steps. The signature covers the exact envelope, not the agent's summary.</text><rect x="40" y="130" width="300" height="210" rx="16" fill="#FFFFFF"/><rect x="40" y="130" width="300" height="6" fill="#2F6FED" clip-path="url(#cb8)"/><rect x="40" y="130" width="300" height="210" rx="16" fill="none" stroke="#E1E4EA" stroke-width="1.5"/><circle cx="72" cy="170" r="15" fill="#2F6FED"/><text x="72.0" y="174.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="96.0" y="177.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#121620" text-anchor="start">Envelope v1</text><text x="62.0" y="214.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#121620" text-anchor="start">{v:1, type:"exec",</text><text x="62.0" y="236.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#121620" text-anchor="start" xml:space="preserve"> argv, cwd, exe, uid, gid,</text><text x="62.0" y="258.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#121620" text-anchor="start" xml:space="preserve"> ppidChain, envHash,</text><text x="62.0" y="280.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#121620" text-anchor="start" xml:space="preserve"> requester, pidfdCookie,</text><text x="62.0" y="302.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#121620" text-anchor="start" xml:space="preserve"> ts, nonce}</text><rect x="400" y="130" width="300" height="210" rx="16" fill="#FFFFFF"/><rect x="400" y="130" width="300" height="6" fill="#2F6FED" clip-path="url(#cb9)"/><rect x="400" y="130" width="300" height="210" rx="16" fill="none" stroke="#E1E4EA" stroke-width="1.5"/><circle cx="432" cy="170" r="15" fill="#2F6FED"/><text x="432.0" y="174.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="456.0" y="177.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#121620" text-anchor="start">Digest</text><text x="422.0" y="214.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#121620" text-anchor="start">sha256(canonicalJson(</text><text x="422.0" y="236.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#121620" text-anchor="start" xml:space="preserve">  envelope))</text><text x="422.0" y="258.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">identical bytes in Go,</text><text x="422.0" y="280.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">the plugin and the app</text><text x="422.0" y="302.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">id = wd- + 32 hex</text><rect x="760" y="130" width="300" height="210" rx="16" fill="#FFFFFF"/><rect x="760" y="130" width="300" height="6" fill="#7C5CF0" clip-path="url(#cb10)"/><rect x="760" y="130" width="300" height="210" rx="16" fill="none" stroke="#E1E4EA" stroke-width="1.5"/><circle cx="792" cy="170" r="15" fill="#7C5CF0"/><text x="792.0" y="174.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="816.0" y="177.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#121620" text-anchor="start">Judge</text><text x="782.0" y="214.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">block list: straight to human</text><text x="782.0" y="236.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">risk 0–100 by axis</text><text x="782.0" y="258.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">a human or a model</text><text x="782.0" y="280.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">outside the server loop</text><text x="782.0" y="302.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">3 denials in a row: escalate</text><rect x="1120" y="130" width="300" height="210" rx="16" fill="#FFFFFF"/><rect x="1120" y="130" width="300" height="6" fill="#7C5CF0" clip-path="url(#cb11)"/><rect x="1120" y="130" width="300" height="210" rx="16" fill="none" stroke="#E1E4EA" stroke-width="1.5"/><circle cx="1152" cy="170" r="15" fill="#7C5CF0"/><text x="1152.0" y="174.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1176.0" y="177.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#121620" text-anchor="start">Signature</text><text x="1142.0" y="214.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#121620" text-anchor="start">{deviceId, id, digest,</text><text x="1142.0" y="236.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="400" fill="#121620" text-anchor="start" xml:space="preserve"> decision, ts, nonce}</text><text x="1142.0" y="258.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">Ed25519, key on the phone</text><!-- feature:hardwareKey --><text x="1142.0" y="280.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">YubiKey: optional</text><!-- /feature --><path d="M342.0,245.0 L398.0,245.0" fill="none" stroke="#2F6FED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2F6FED)"/><path d="M702.0,245.0 L758.0,245.0" fill="none" stroke="#2F6FED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2F6FED)"/><path d="M1062.0,245.0 L1118.0,245.0" fill="none" stroke="#7C5CF0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah7C5CF0)"/><path d="M1270.0,342.0 L1270.0,418.0" fill="none" stroke="#7C5CF0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah7C5CF0)"/><rect x="1284.0" y="366.0" width="58.4375" height="28" rx="14" fill="#FFFFFF" stroke="#7C5CF0" stroke-width="1.2"/><text x="1294.0" y="385.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#7C5CF0" text-anchor="start">ticket</text><rect x="1120" y="420" width="300" height="230" rx="16" fill="#FFFFFF"/><rect x="1120" y="420" width="300" height="6" fill="#2F6FED" clip-path="url(#cb12)"/><rect x="1120" y="420" width="300" height="230" rx="16" fill="none" stroke="#E1E4EA" stroke-width="1.5"/><circle cx="1152" cy="460" r="15" fill="#2F6FED"/><text x="1152.0" y="464.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1176.0" y="467.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#121620" text-anchor="start">Check in wardend</text><text x="1142.0" y="504.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">1  device is trusted</text><text x="1142.0" y="526.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">2  |now − ts| ≤ 60 s</text><text x="1142.0" y="548.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">3  signature is valid</text><text x="1142.0" y="570.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">4  nonce not seen before</text><text x="1142.0" y="592.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">5  digest matches envelope</text><rect x="560" y="420" width="500" height="230" rx="16" fill="#FFFFFF"/><rect x="560" y="420" width="500" height="6" fill="#121620" clip-path="url(#cb13)"/><rect x="560" y="420" width="500" height="230" rx="16" fill="none" stroke="#E1E4EA" stroke-width="1.5"/><circle cx="592" cy="460" r="15" fill="#121620"/><text x="592.0" y="464.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="616.0" y="467.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#121620" text-anchor="start">Answer to the kernel</text><rect x="580" y="490" width="225" height="136" rx="12" fill="#E4F5EC" stroke="#9ED8B6" stroke-width="1.2"/><text x="596.0" y="520.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#1F9D55" text-anchor="start">CONTINUE</text><text x="596.0" y="548.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#121620" text-anchor="start">exec proceeds;</text><text x="596.0" y="569.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#121620" text-anchor="start">new image checked against</text><text x="596.0" y="590.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#121620" text-anchor="start">the envelope, else SIGKILL</text><rect x="815" y="490" width="225" height="136" rx="12" fill="#FBE7E7" stroke="#F0AAAA" stroke-width="1.2"/><text x="831.0" y="520.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#D64545" text-anchor="start">EPERM</text><text x="831.0" y="548.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#121620" text-anchor="start">deny, TTL expired,</text><text x="831.0" y="569.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#121620" text-anchor="start">bad signature</text><text x="831.0" y="590.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#121620" text-anchor="start">or block list</text><path d="M1118.0,540.0 L1062.0,540.0" fill="none" stroke="#121620" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah121620)"/><rect x="40" y="420" width="440" height="230" rx="16" fill="#FFFFFF"/><rect x="40" y="420" width="440" height="6" fill="#5F6776" clip-path="url(#cb14)"/><rect x="40" y="420" width="440" height="230" rx="16" fill="none" stroke="#E1E4EA" stroke-width="1.5"/><circle cx="72" cy="460" r="15" fill="#5F6776"/><text x="72.0" y="464.6" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="96.0" y="467.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#121620" text-anchor="start">Journal</text><text x="62.0" y="504.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">ts, id, digest, decision,</text><text x="62.0" y="526.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">who decided, latency</text><text x="62.0" y="548.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">prev = hash of last entry</text><text x="62.0" y="570.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#5F6776" text-anchor="start">signed by the supervisor key</text><rect x="300" y="442" width="40" height="30" rx="6" fill="#EEF1F6" stroke="#E1E4EA" stroke-width="1"/><rect x="356" y="442" width="40" height="30" rx="6" fill="#EEF1F6" stroke="#E1E4EA" stroke-width="1"/><path d="M342.0,457.0 L354.0,457.0" fill="none" stroke="#5F6776" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah5F6776)"/><rect x="412" y="442" width="40" height="30" rx="6" fill="#171B23" stroke="#E1E4EA" stroke-width="1"/><path d="M398.0,457.0 L410.0,457.0" fill="none" stroke="#5F6776" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah5F6776)"/><text x="432.0" y="462.0" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#EDEFF3" text-anchor="middle">#</text><path d="M558.0,540.0 L482.0,540.0" fill="none" stroke="#5F6776" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah5F6776)"/><text x="520.0" y="528.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6776" text-anchor="middle">append</text><rect x="40" y="690" width="1380" height="56" rx="12" fill="#FCF1D9" stroke="#EBCB85" stroke-width="1.2"/><text x="64.0" y="724.0" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B4A00" text-anchor="start">Fail-closed: no signed ticket within TTL means EPERM. What an approved command starts is checked on its own.</text></svg>
