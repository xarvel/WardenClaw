# SPDX-License-Identifier: Apache-2.0
# relay/ (Cloudflare Worker): typecheck and the workerd test suite on every change; a deploy of
# main to relay.wardenclaw.dev when the repository has the Cloudflare secrets.
name: relay

on:
  push:
    branches: [main]
    paths: ["relay/**", "protocol/README.md", ".github/workflows/relay.yml"]
  pull_request:
    paths: ["relay/**", "protocol/README.md", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: relay
    permissions:
      contents: read
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
