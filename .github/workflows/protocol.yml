# SPDX-License-Identifier: Apache-2.0
# protocol/: the vectors exist in one copy and must hold for both implementations (the Swift
# watch code reads the same files; its tests need a Swift toolchain and do not run here).
# 1. The generators reproduce the committed files byte for byte (canonical JSON from
#    protocol/vectors/canonical.mjs, the generator is self-contained; hardware and es256 vectors
#    from the Go reference).
# 2. The vector tests of the daemon (Go) and the app (TypeScript) pass against protocol/vectors/.
name: protocol

on:
  push:
    branches: [main]
    paths:
      - "protocol/**"
      - "daemon/envelope/**"
      - "daemon/cmd/wardenctl/**"
      - "app/src/core/**"
      - "app/scripts/test-core.mjs"
      - ".github/workflows/protocol.yml"
  pull_request:
    paths:
      - "protocol/**"
      - "daemon/envelope/**"
      - "daemon/cmd/wardenctl/**"
      - "app/src/core/**"
      - "app/scripts/test-core.mjs"
      - ".github/workflows/protocol.yml"

permissions: {}

concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vectors are reproducible
        run: |
          node protocol/vectors/gen_vectors.mjs > protocol/vectors/canonical_vectors.json
          (cd daemon && go test ./envelope -run 'TestHWVectors|TestES256Vectors' -update-hw -update-es256)
          git diff --exit-code -- protocol/vectors
      - name: Go (daemon)
        working-directory: daemon
        run: go test ./envelope ./cmd/wardenctl -run 'Vectors|Compat'
      - name: TypeScript (app)
        working-directory: app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-name-pattern='vectors' scripts/test-core.mjs
