# Drop-in for ~/.config/systemd/user/openclaw-gateway.service - PHASE 2: ticket (enforce).
# In tripwire policy (default) every exec that triggers a rule (remote execution, delegation,
# package installation, secrets, ...) waits for an Ed25519 signature from the WardenClaw
# device over the envelope; in policy_mode root it waits for every "root" (exec outside
# service execs and outside the approved subtree). Without a signature: EPERM on TTL (fail-closed).
# Enable ONLY after the observe journal shows an acceptable card stream (wardend replay)
# and any gateway service execs that trigger rules are added to the policy
# (README, "observe -> ticket").
#
#   # @GATEWAY_CMD@ = gateway command from ExecStart of the main unit (absolute paths; node
#   # flags such as --max-old-space-size should be copied from there too):
#   #   systemctl --user cat openclaw-gateway
#   GW="$(command -v node) $(npm root -g)/openclaw/dist/index.js gateway --port 18789"
#   sed "s#@GATEWAY_CMD@#$GW#" deploy/wardend-ticket.conf > ~/.config/systemd/user/openclaw-gateway.service.d/wardend.conf
#   systemctl --user daemon-reload && systemctl --user restart openclaw-gateway
[Service]
ExecStart=
ExecStart=%h/.local/bin/wardend run --mode ticket --config %h/.wardend/config.json --quiet -- @GATEWAY_CMD@
KillMode=mixed
SuccessExitStatus=0 143
