# Drop-in for ~/.config/systemd/user/openclaw-gateway.service - PHASE 1: observe.
# wardend runs the gateway under a seccomp filter, allows everything, and logs what WOULD
# happen in ticket mode: in tripwire policy (default) tripwire / implied / refuse / service /
# logged / deny_always; in policy_mode root: root / delegating / service / inherit / deny_always.
# Card stream without printing argv: wardend replay --journal ... --config ...
# Install/rollback: wardend README, "Enable on gateway" section. NOT installed automatically.
#
#   # @GATEWAY_CMD@ = gateway command from ExecStart of the main unit (absolute paths; node
#   # flags such as --max-old-space-size should be copied from there too):
#   #   systemctl --user cat openclaw-gateway
#   GW="$(command -v node) $(npm root -g)/openclaw/dist/index.js gateway --port 18789"
#   sed "s#@GATEWAY_CMD@#$GW#" deploy/wardend-observe.conf > ~/.config/systemd/user/openclaw-gateway.service.d/wardend.conf
#   systemctl --user daemon-reload && systemctl --user restart openclaw-gateway
[Service]
# Empty line resets the main unit ExecStart; the second line is the same gateway but via wardend.
ExecStart=
ExecStart=%h/.local/bin/wardend run --mode observe --config %h/.wardend/config.json --quiet -- @GATEWAY_CMD@
# On stop, SIGTERM goes only to the main process (wardend), which forwards it to the gateway;
# systemd sends SIGKILL to the rest of the tree after TimeoutStopSec. Already set in the
# main unit; repeated here explicitly.
KillMode=mixed
# wardend returns the gateway exit code; death by SIGTERM = 143 (same as without wardend).
SuccessExitStatus=0 143
