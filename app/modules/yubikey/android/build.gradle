plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.wardenclaw.modules'
version = '0.1.0'

android {
  namespace "com.wardenclaw.modules.yubikey"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

// Yubico's official library (Apache-2.0): the NFC transport and CTAP2 (FIDO2).
//
// Pinned to 3.1.0, not 3.2.1: 3.2.x has minCompileSdk=37 in its aar-metadata, while the Expo SDK builds
// the app against android-36 (AGP 8.12 does not support anything above 36), so the build fails at
// :app:checkReleaseAarMetadata. 3.1.0 has minCompileSdk=36, exactly what we need.
// The API that YubikeyModule uses (Ctap2Session, ClientPin, PinUvAuthProtocol*,
// AuthenticatorData, Cbor, CtapException, YubiKitManager, Nfc*) is byte-for-byte identical in 3.1.0
// and 3.2.1: 3.2.1 only adds InfoData.getFirmwareVersion(), which we do not need.
// Bump it back once Expo moves to compileSdk 37.
def yubikitVersion = '3.1.0'

dependencies {
  implementation "com.yubico.yubikit:android:${yubikitVersion}"
  implementation "com.yubico.yubikit:fido:${yubikitVersion}"
}
